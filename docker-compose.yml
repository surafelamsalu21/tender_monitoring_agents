# Run the API in Linux so Playwright/crawl4ai behave the same on Windows, Mac, and CI.
#
# Usage (from repo root):
#   docker compose build
#   docker compose up
#
# Copy .env.example to .env and fill keys first. SQLite is stored in the host file
# `./tender_monitoring.db` so Docker and local runs share the same data.
#
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Use the host DB file so Docker and local runs share one database.
      DATABASE_URL: sqlite:////app/tender_monitoring.db
      LLM_PROVIDER: anthropic
    volumes:
      - ./tender_monitoring.db:/app/tender_monitoring.db
      - ./backups:/app/backups
      - ./backups_secondary:/app/backups_secondary
